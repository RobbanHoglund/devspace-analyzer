name: Native startup diagnostics

on:
  push:
    branches: [feature/pilot]
    paths:
      - '.github/workflows/native-diagnostics.yml'
      - 'scripts/windows-test-runtime.ps1'
      - 'scripts/windows-diagnostics.ps1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  startup:
    name: Verify previously built Windows pilot
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: devspace-windows-x64
          run-id: 38041442164
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prebuilt
      - name: Prepare the supported WebView2 runtime
        run: ./scripts/windows-test-runtime.ps1
      - name: Inspect startup and perform native scan
        shell: pwsh
        run: |
          $exe = Get-ChildItem prebuilt -Recurse -Filter devspace-analyzer.exe | Select-Object -First 1
          if (-not $exe) { throw 'Prebuilt executable was not downloaded.' }
          $env:DEVSPACE_STARTUP_DIAGNOSTICS = '1'
          node scripts/native-smoke.mjs $exe.FullName
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
