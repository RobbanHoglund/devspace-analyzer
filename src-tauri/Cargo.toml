[package]
name = "devspace-analyzer"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Local developer disk intelligence"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devspace-core = { path = "../crates/core" }
